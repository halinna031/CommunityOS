<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommunityOS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#edf1f0; --card:#fff; --ink:#12242b; --muted:#53666d; --line:#c9d3d6;
  --blue:#1646b8; --blue-soft:#e3ebfb; --yellow:#f5b700; --yellow-soft:#fff4cc;
  --green:#14774a; --green-soft:#dff3e8; --amber:#8a5200; --red:#b3261e; --red-soft:#fbe4e2;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{--ground:#0f1a1f; --card:#17262d; --ink:#e8f0f2; --muted:#9db0b7; --line:#2c4049;
    --blue:#7da2ff; --blue-soft:#1b2c52; --yellow-soft:#3a3010; --green:#5fd39b; --green-soft:#123a29;
    --amber:#f0b45a; --red:#ff8a80; --red-soft:#431d1b;}
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding-top:env(safe-area-inset-top,0)}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}
a{color:var(--blue)}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--yellow);margin-right:8px;vertical-align:-1px;box-shadow:0 0 0 3px var(--blue-soft)}
.topbar .sp{flex:1}
.topbar button,.topbar a,.topbar select{font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-decoration:none;color:var(--ink);cursor:pointer}
.sample{background:var(--yellow-soft);color:var(--ink);padding:8px 20px;font-size:14px;border-bottom:1px solid var(--line)}

.layout{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:20px;padding:20px;max-width:1400px;margin:0 auto;align-items:start}
.map-col{position:sticky;top:16px}
#map{height:calc(100vh - 140px);min-height:360px;border-radius:var(--radius);border:1px solid var(--line);background:var(--blue-soft)}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:14px}
  .map-col{position:static;order:2} #map{height:340px}
}
@media (max-width:560px){
  .topbar{gap:8px;padding:10px 12px} #region{display:none} #regionSelect{max-width:145px}
}

.ask h1{font-size:clamp(26px,4vw,34px);margin:6px 0 12px;letter-spacing:-.02em}
.ask textarea{width:100%;min-height:84px;padding:14px;border:2px solid var(--ink);border-radius:var(--radius);background:var(--card);resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.primary{background:var(--blue);color:#fff;border:0;padding:11px 20px;border-radius:var(--radius);font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){.primary{color:#0f1a1f}}
.primary:disabled{opacity:.6;cursor:wait}
.ghost{background:transparent;border:1px solid var(--line);padding:9px 12px;border-radius:var(--radius);cursor:pointer}
.region-select{padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);min-width:170px}
.ghost[aria-pressed=true]{background:var(--blue-soft);border-color:var(--blue)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--blue)}

.understood{margin:18px 0 6px;font-size:14px;color:var(--muted)}
.tag{display:inline-block;background:var(--blue-soft);color:var(--ink);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;font-size:13px}
.notice{border-radius:var(--radius);padding:12px 14px;margin:12px 0;font-size:15px;border:1px solid var(--line);background:var(--card)}
.notice.emerg{background:var(--red-soft);border-color:var(--red)}
.notice.emerg ul{margin:6px 0 0;padding-left:20px}
.notice.relax{background:var(--yellow-soft);border-color:var(--yellow)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;transition:border-color .15s, box-shadow .15s}
.card.hl{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.card.review{border-left:6px solid var(--yellow)}
.head{display:flex;gap:12px;align-items:flex-start}
.rank{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:700;font-family:"Bricolage Grotesque",sans-serif}
.head h2{font-size:20px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.pill{display:inline-block;font-size:13px;border-radius:999px;padding:1px 10px;margin-left:6px;vertical-align:2px}
.pill.open{background:var(--green-soft);color:var(--green)} .pill.closed{background:var(--red-soft);color:var(--red)} .pill.unk{background:var(--yellow-soft);color:var(--amber)}
.score{margin-left:auto;text-align:right;flex:none}
.score b{font-family:"Bricolage Grotesque",sans-serif;font-size:26px}
.score small{display:block;color:var(--muted);font-size:12px}
.summary{margin:12px 0 8px}
.sigs{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:15px}
.sigs li{display:flex;gap:8px}
.sigs .ic{flex:none;width:18px;text-align:center;font-weight:700}
.sigs .ok .ic{color:var(--green)} .sigs .warn .ic{color:var(--amber)} .sigs .bad .ic{color:var(--red)} .sigs .info .ic{color:var(--muted)}

.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:14px 0 4px}
.bar span{display:block;height:100%}
details{margin-top:8px;font-size:14px}
summary{cursor:pointer;color:var(--blue);padding:2px 0}
.bd{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;margin-top:6px}
.bd .sw{width:12px;height:12px;border-radius:3px}
.hours{border-collapse:collapse;margin-top:6px} .hours td{padding:1px 14px 1px 0;vertical-align:top}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin-top:10px;color:var(--muted)}
.src{font-size:13px;color:var(--muted);margin-top:10px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.reportbox{margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:var(--radius);display:grid;gap:8px}
.reportbox select,.reportbox input{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.linkbtn{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.empty{color:var(--muted);padding:30px 0}
.pin{background:var(--ink);color:var(--card);border:2px solid var(--yellow);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-size:13px}
.pin-wrap{position:relative;display:flex;width:max-content;height:28px}
.pin-many{width:auto!important;min-width:28px;padding:0 6px;border-radius:16px!important;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><i></i>CommunityOS</div>
  <span id="region" style="color:var(--muted);font-size:14px"></span>
  <div class="sp"></div>
  <select id="regionSelect" aria-label="Region"></select>
  <button id="langBtn" aria-label="Switch language">EN</button>
  <a href="/admin" id="adminLink"></a>
</div>
<div class="sample" id="sampleBanner" hidden></div>

<div class="layout">
  <main>
    <section class="ask">
      <h1 id="h1"></h1>
      <textarea id="q" maxlength="500" aria-label="request"></textarea>
      <div class="row">
        <button class="primary" id="go"></button>
        <button class="ghost" id="locBtn" aria-pressed="false"></button>
      </div>
      <div class="chips" id="chips"></div>
    </section>
    <div id="out" aria-live="polite"></div>
  </main>
  <aside class="map-col"><div id="map" role="img" aria-label="map"></div></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ------------------------------------------------------------------ i18n */
const T = {
 zh:{region:"按地区查找社区资源",h1:"你在找什么公共资源？",ph:"例如：我有一张旧沙发想捐掉 / 哪里有免费学习辅导 / 我需要安静的自习地方",
  go:"查找资源",going:"查找中…",loc:"使用我的位置",locOn:"已使用位置",admin:"管理页",
  sample:"当前为示例数据（机构为虚构），用于演示。上线前请替换为已核实的真实资源。",
  understood:"搜索条件",none:"数据库中没有查到相关资源",cat:{food_assistance:"食物援助",donation:"物品捐赠",learning:"免费学习/辅导",study_space:"自习空间",healthcare:"医疗服务"},
  cons:{free:"免费",open_now:"现在营业",open_24h:"24小时开放",no_id:"无需证件",no_appointment:"无需预约",near_campus:"靠近校园"},
  id:{students:"学生",newcomers:"新移民",low_income:"低收入",seniors:"老年人"},
  relaxNeeds:"没有完全符合条件的资源，以下是相近结果。",
  relaxCons:c=>`没有资源同时满足所有条件。以下结果可能不符合：${c}。`,
  emerg:"紧急信息",score:"匹配分",breakdown:"打分明细",hours:"营业时间",days:["周一","周二","周三","周四","周五","周六","周日"],
  closedDay:"休息",appt:"需预约",walk:"免预约",idreq:"需证件",free:"免费",fee:"收费",feeUnknown:"费用请咨询机构",lang:"语言",verified:"核实于",source:"信息来源",
  call:"致电",report:"反馈信息问题",reportWhy:"问题类型",send:"提交反馈",cancel:"取消",note:"补充说明（可选）",
  reasons:{closed:"已关门/停止服务",hours_changed:"营业时间变了",items_changed:"不再接收/提供该项",wrong_address:"地址错误",other:"其他"},
  thanks:n=>`反馈已提交。这条资源目前有 ${n} 条待处理反馈。`,dup:"你已经提交过这条资源的反馈。",
  review:n=>`有 ${n} 条反馈称信息可能已过时；核实前，搜索排序会降低。`,conf:"可信度",
  comp:{match:"需求匹配",eligibility:"资格",distance:"距离",open:"营业状态",freshness:"信息更新情况",barrier:"使用门槛"},
  pts:"分",err:"暂时无法完成搜索，请稍后重试。",km:"km",confidence:"信息可信度",hoursUnknown:"营业时间未确认"},
 en:{region:"Find community resources by region",h1:"What community resource are you looking for?",ph:"e.g. I want to donate an old sofa / where can I get free tutoring / I need a quiet place to study",
  go:"Find resources",going:"Searching…",loc:"Use my location",locOn:"Using location",admin:"Admin",
  sample:"Showing sample data (organizations are fictional) for demo purposes. Replace with verified listings before launch.",
  understood:"Search filters",none:"No matching resources found in the database",cat:{food_assistance:"Food assistance",donation:"Donations",learning:"Free learning help",study_space:"Study spaces",healthcare:"Healthcare services"},
  cons:{free:"free",open_now:"open now",open_24h:"open 24h",no_id:"no ID",no_appointment:"no appointment",near_campus:"near campus"},
  id:{students:"student",newcomers:"newcomer",low_income:"low income",seniors:"senior"},
  relaxNeeds:"No exact match. Here are some similar resources.",
  relaxCons:c=>`No resources met all your filters. These results may not meet: ${c}.`,
  emerg:"Urgent help",score:"Match",breakdown:"Score breakdown",hours:"Hours",days:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
  closedDay:"Closed",appt:"Appointment",walk:"Walk-in",idreq:"ID needed",free:"Free",fee:"Fee",feeUnknown:"Ask provider about fees",lang:"Languages",verified:"Verified",source:"Source",
  call:"Call",report:"Report an issue",reportWhy:"Issue type",send:"Submit report",cancel:"Cancel",note:"Additional details (optional)",
  reasons:{closed:"Closed / no longer operating",hours_changed:"Hours changed",items_changed:"No longer accepts/offers this",wrong_address:"Wrong address",other:"Other"},
  thanks:n=>`Report submitted. This listing now has ${n} open report(s).`,dup:"You've already reported this listing.",
  review:n=>`${n} report(s) flag this listing as possibly outdated. It will appear lower in search until verified.`,conf:"Confidence",
  comp:{match:"Need match",eligibility:"Eligibility",distance:"Distance",open:"Open status",freshness:"Last updated",barrier:"Barriers"},
  pts:"pts",err:"Search is temporarily unavailable. Please try again.",km:"km",confidence:"Source confidence",hoursUnknown:"Hours unknown"}
};
const EXAMPLES = {zh:["我有一张旧沙发想捐掉","哪里有免费的数学辅导","安静的自习场所","我想找牙科服务","我需要疫苗服务"],
  en:["I need somewhere to donate furniture","Free tutoring","I'm a student short on groceries near campus","A quiet place to study","Find dental services","Find vaccination services"]};
const COLORS = {match:"#1646b8",eligibility:"#5b87e6",distance:"#2a9d8f",open:"#8fd3b0",freshness:"#f5b700",barrier:"#b8c4c8"};
const ICON = {ok:"✓",warn:"!",bad:"✕",info:"i"};

let lang = "en";
let useLoc = false, loc = null, map = null, markers = {}, mapMarkerLayer = null, userMarker = null, lastData = null;
let regions = [], selectedRegion = "waterloo_region";
const GEOCODE_CACHE_KEY = "communityos-geocode-v1";
let geocodeCache = {};
try { geocodeCache = JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY) || "{}"); } catch(e) {}
let geocodeQueue = Promise.resolve(), lastGeocodeAt = 0, geocodePending = new Set();
let clientId = "";
try{ clientId = localStorage.getItem("cid") || (crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)); localStorage.setItem("cid",clientId);}catch(e){ clientId = String(Math.random()).slice(2); }

const $ = s => document.querySelector(s);
const t = () => T[lang];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function applyLang(){
  document.documentElement.lang = lang;
  $("#region").textContent = t().region; $("#h1").textContent = t().h1; $("#q").placeholder = t().ph;
  $("#go").textContent = t().go; $("#locBtn").textContent = useLoc ? t().locOn : t().loc;
  $("#langBtn").textContent = lang==="zh" ? "EN" : "中文"; $("#adminLink").textContent = t().admin;
  $("#chips").innerHTML = EXAMPLES[lang].map(x=>`<button class="chip" type="button">${esc(x)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ $("#q").value=b.textContent; search(); });
  $("#sampleBanner").textContent = t().sample;
  renderRegionOptions();
  if(lastData) render(lastData);
}
$("#langBtn").onclick = ()=>{ lang = lang==="zh"?"en":"zh"; applyLang(); };
$("#locBtn").onclick = ()=>{
  if(useLoc){ useLoc=false; loc=null; $("#locBtn").setAttribute("aria-pressed","false"); applyLang(); drawMap(lastData?.results||[]); return; }
  navigator.geolocation?.getCurrentPosition(p=>{ loc={lat:p.coords.latitude,lng:p.coords.longitude}; useLoc=true;
    $("#locBtn").setAttribute("aria-pressed","true"); applyLang(); drawMap(lastData?.results||[]); }, ()=>{}, {timeout:8000});
};
$("#go").onclick = search;
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) search(); });

/* ------------------------------------------------------------------ search */
async function search(){
  const q = $("#q").value.trim(); if(!q) return;
  $("#go").disabled = true; $("#go").textContent = t().going;
  try{
    const r = await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({query:q, lat:loc?.lat ?? null, lng:loc?.lng ?? null, region_id:selectedRegion})});
    if(!r.ok) throw new Error((await r.json()).detail || r.status);
    lastData = await r.json();
    lang = lastData.intent.language; applyLang();   // answer in the language the user wrote
  }catch(e){ $("#out").innerHTML = `<div class="notice emerg">${esc(t().err)}</div>`; }
  finally{ $("#go").disabled=false; $("#go").textContent=t().go; }
}

function render(d){
  const i = d.intent, tt = t();
  const tags = [];
  if(i.category) tags.push(tt.cat[i.category]);
  (i.needs||[]).forEach(n=>tags.push(n));
  Object.entries(i.constraints).filter(([,v])=>v).forEach(([k])=>tags.push(tt.cons[k]));
  (i.identity||[]).forEach(x=>tags.push(tt.id[x]));
  let html = `<div class="understood">${esc(tt.understood)}：${tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("") || "—"}</div>`;
  if(d.emergency) html += `<div class="notice emerg"><b>${esc(tt.emerg)}：${esc(d.emergency.title)}</b><ul>${d.emergency.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`;
  d.relaxed.forEach(x=>{ html += `<div class="notice relax">${x==="needs"?esc(tt.relaxNeeds):esc(tt.relaxCons(x.split(":")[1].split(",").map(c=>tt.cons[c]||c).join(", ")))}</div>`; });
  if(d.fallback) html += `<div class="notice"><b>${esc(tt.none)}</b><br>${esc(d.fallback)}</div>`;
  html += d.results.map(card).join("");
  $("#out").innerHTML = html;
  bindCards(d);
  drawMap(d.results);
}

function card(r){
  const tt = t(), st = r.open_status;
  const pill = st.is_open===true ? `<span class="pill open">${lang==="zh"?"营业中":"Open"}</span>` :
               st.is_open===false ? `<span class="pill closed">${lang==="zh"?"未营业":"Closed"}</span>` : `<span class="pill unk">${tt.hoursUnknown}</span>`;
  const bar = Object.keys(COLORS).map(k=>`<span title="${esc(tt.comp[k])} ${r.weighted[k]}" style="width:${r.weighted[k]}%;background:${COLORS[k]}"></span>`).join("");
  const bd = Object.keys(COLORS).map(k=>`<span class="sw" style="background:${COLORS[k]}"></span><span>${esc(tt.comp[k])} (${Math.round(r.weights[k]*100)}%)</span><b>${r.weighted[k]} ${esc(tt.pts)}</b>`).join("");
  const hrs = r.hours_table.map((h,ix)=>`<tr><td>${tt.days[ix]}</td><td>${h.ranges.length?esc(h.ranges.join(", ")):`<span style="color:var(--muted)">${tt.closedDay}</span>`}</td></tr>`).join("");
  const sigs = r.signals.map(s=>`<li class="${s.level}"><span class="ic" aria-hidden="true">${ICON[s.level]}</span><span>${esc(s.text)}</span></li>`).join("");
  const facts = [
    r.requires_appointment ? tt.appt : tt.walk, r.requires_id ? tt.idreq : null,
    r.fee_cad===null || r.fee_cad===undefined ? tt.feeUnknown : r.fee_cad>0 ? `${tt.fee} $${r.fee_cad}` : tt.free,
    r.languages.length ? `${tt.lang}: ${r.languages.join(", ")}` : null].filter(Boolean).map(esc).join(" · ");
  const review = r.needs_review ? `<div class="notice relax" style="margin:10px 0 0">${esc(tt.review(r.open_reports))}</div>` : "";
  return `<article class="card ${r.needs_review?"review":""}" id="card-${r.id}" data-id="${r.id}">
    <div class="head"><div class="rank">${r.rank}</div>
      <div><h2>${esc(r.name)}${pill}</h2><div class="sub">${esc(r.address)}</div></div>
      <div class="score"><b>${r.score}</b><small>${esc(tt.score)}</small></div></div>
    <p class="summary">${esc(r.summary)}</p>
    <ul class="sigs">${sigs}</ul>
    <div class="bar" role="img" aria-label="${esc(tt.breakdown)}">${bar}</div>
    <details><summary>${esc(tt.breakdown)}</summary><div class="bd">${bd}</div></details>
    <details><summary>${esc(tt.hours)}</summary><table class="hours">${hrs}</table></details>
    <p style="margin:10px 0 0;font-size:15px">${esc(r.description)}</p>
    <div class="facts">${facts}</div>
    ${review}
    <div class="src">
      <span>${esc(tt.verified)} ${esc((r.last_verified_at||"").slice(0,10))} · ${esc(tt.confidence)} ${Math.round(r.confidence*100)}%</span>
      ${r.phone?`<a href="tel:${esc(r.phone)}">${esc(tt.call)} ${esc(r.phone)}</a>`:""}
      <a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(tt.source)}</a>
      <button class="linkbtn" data-report="${r.id}">${esc(tt.report)}</button>
    </div>
    <div data-rbox="${r.id}"></div>
  </article>`;
}

function bindCards(d){
  document.querySelectorAll("[data-report]").forEach(b=>b.onclick=()=>openReport(b.dataset.report));
  document.querySelectorAll(".card").forEach(c=>{
    c.onmouseenter=()=>hl(c.dataset.id,true); c.onmouseleave=()=>hl(c.dataset.id,false);
  });
}
function hl(id,on){ document.getElementById("card-"+id)?.classList.toggle("hl",on); }

/* ------------------------------------------------------------------ reporting */
function openReport(id){
  const tt = t(), box = document.querySelector(`[data-rbox="${id}"]`);
  if(box.innerHTML){ box.innerHTML=""; return; }
  box.innerHTML = `<div class="reportbox"><label>${esc(tt.reportWhy)}
      <select>${Object.entries(tt.reasons).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("")}</select></label>
    <input maxlength="300" placeholder="${esc(tt.note)}">
    <div class="row" style="margin:0"><button class="primary" type="button">${esc(tt.send)}</button>
    <button class="ghost" type="button">${esc(tt.cancel)}</button><span class="msg" aria-live="polite"></span></div></div>`;
  const [send, cancel] = box.querySelectorAll("button"), msg = box.querySelector(".msg");
  cancel.onclick = ()=>box.innerHTML="";
  send.onclick = async ()=>{
    send.disabled = true;
    try{
      const r = await fetch("/api/report",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({resource_id:id,reason:box.querySelector("select").value,note:box.querySelector("input").value,client_id:clientId})});
      const j = await r.json(); if(!r.ok) throw new Error(j.detail);
      msg.textContent = j.duplicate ? tt.dup : tt.thanks(j.open_reports);
      setTimeout(search, 1600);  // re-rank live: the card sinks / gets flagged
    }catch(e){ msg.textContent = tt.err; send.disabled=false; }
  };
}

/* ------------------------------------------------------------------ map */
function drawMap(results){
  if(typeof L === "undefined") return;
  const selected = regions.find(r=>r.id===selectedRegion);
  const center = selected?.center || [43.4516,-80.4925];
  if(!map){
    map = L.map("map").setView(loc ? [loc.lat,loc.lng] : center, loc ? 13 : selectedRegion==="waterloo_region"?11:13);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
    mapMarkerLayer = L.layerGroup().addTo(map);
  }
  // Clear one dedicated Leaflet layer on every redraw. This also removes stale
  // markers if the marker index changes between results or geocoding callbacks.
  mapMarkerLayer.clearLayers(); markers = {};
  const groups = new Map();
  const serviceAreas = [];
  results.forEach(r=>{
    const locations = Array.isArray(r.locations) && r.locations.length ? r.locations : [r];
    let foundLocation = false;
    locations.forEach((location,index)=>{
      const address = location.address || r.address;
      const lat = location.lat ?? (index===0 ? r.lat : null), lng = location.lng ?? (index===0 ? r.lng : null);
      const directPoint=lat!==null && lng!==null ? [Number(lat),Number(lng)] : null;
      const canonicalKey=placeKey(address);
      const cachedPoint=cachedGeocodePoint(address);
      const point=validPoint(directPoint)?directPoint:validPoint(cachedPoint)?cachedPoint:null;
      if(!point) { if(canGeocode(address)) queueGeocode(address); return; }
      if(canonicalKey && !validPoint(geocodeCache[`place:${canonicalKey}`])){
        geocodeCache[`place:${canonicalKey}`]=point;
        try{ localStorage.setItem(GEOCODE_CACHE_KEY,JSON.stringify(geocodeCache)); }catch(e){}
      }
      foundLocation = true;
      // Normalize street address (postal code, province, unit/floor, and common
      // street suffixes) before grouping. Geocoders can return slightly different
      // coordinates for two spellings of the same clinic address.
      const key = placeKey(address) || point.map(n=>Number(n).toFixed(5)).join(",");
      if(!groups.has(key)) groups.set(key,{point,entries:[]});
      const group=groups.get(key);
      if(!group.entries.some(e=>e.r.id===r.id)) group.entries.push({r,location,index});
    });
    // This listing is a phone referral service, not a walk-in location. Show
    // it at the selected region's centre with a distinct, explicitly labelled symbol.
    if(!foundLocation && (r.tags||[]).includes("referral_service")) serviceAreas.push(r);
  });
  const points = [];
  groups.forEach(({point,entries},key)=>{
    const label=entries.map(({r,location})=>`<button class="linkbtn" data-resource-id="${esc(r.id)}">${esc(r.name)}${location.label ? ` — ${esc(location.label)}` : ""}</button>`).join("<br>");
    const ranks=[...new Set(entries.map(({r})=>Number(r.rank)).filter(Number.isFinite))].sort((a,b)=>a-b);
    const pinLabel=ranks.join(",");
    const tooltip=entries.map(({r,location})=>{
      const hasMultipleLocations=Array.isArray(r.locations)&&r.locations.length>1;
      return `${r.name}${hasMultipleLocations?` — ${location.label||location.address}`:""}`;
    }).join(" | ");
    const pinWidth=Math.max(30,pinLabel.length*8+16);
    const m=L.marker(point,{icon:L.divIcon({className:"",html:`<div class="pin-wrap"><div class="pin${ranks.length>1?" pin-many":""}">${esc(pinLabel)}</div></div>`,iconSize:[pinWidth,30],iconAnchor:[pinWidth/2,14]})}).addTo(mapMarkerLayer);
    m.bindTooltip(esc(tooltip));
    m.bindPopup(`<div class="map-popup">${label}</div>`);
    m.on("popupopen",e=>e.popup.getElement()?.querySelectorAll("[data-resource-id]").forEach(el=>el.addEventListener("click",()=>{
      const id=el.dataset.resourceId;
      document.getElementById("card-"+id)?.scrollIntoView({behavior:"smooth",block:"center"}); hl(id,true); setTimeout(()=>hl(id,false),1500);
    })));
    markers[key]=m;
  });
  if(serviceAreas.length){
    const area=L.circleMarker(center,{radius:11,color:"#fff",weight:3,fillColor:"#7c3aed",fillOpacity:.95}).addTo(mapMarkerLayer);
    area.bindTooltip(lang==="zh"?"电话转介服务覆盖该地区（非实体地址）":"Phone referral service for this region (no walk-in address)");
    area.bindPopup(serviceAreas.map(r=>`<div><button class="linkbtn" data-resource-id="${esc(r.id)}">${esc(r.name)}</button><br><small>${lang==="zh"?"电话服务；地图点为地区中心，并非服务地点。":"Phone service; this point is the region centre, not a service location."}</small></div>`).join(""));
    area.on("popupopen",e=>e.popup.getElement()?.querySelectorAll("[data-resource-id]").forEach(el=>el.addEventListener("click",()=>{
      const id=el.dataset.resourceId;
      document.getElementById("card-"+id)?.scrollIntoView({behavior:"smooth",block:"center"}); hl(id,true); setTimeout(()=>hl(id,false),1500);
    })));
    markers[`service-area:${serviceAreas.map(r=>r.id).join(",")}`]=area;
  }
  if(userMarker) userMarker.remove();
  if(useLoc && loc){
    userMarker = L.circleMarker([loc.lat,loc.lng],{radius:9,color:"#fff",weight:3,fillColor:"#2563eb",fillOpacity:1}).addTo(map);
    userMarker.bindTooltip(lang==="zh"?"你的位置":"Your location");
    points.push(userMarker);
  } else userMarker = null;
  points.push(...mapMarkerLayer.getLayers());
  if(points.length) map.fitBounds(L.featureGroup(points).getBounds().pad(0.3),{maxZoom:14});
  else map.setView(center, selectedRegion==="waterloo_region"?11:13);
  setTimeout(()=>map.invalidateSize(),50);
}

function geocodeKey(address){ return String(address||"").trim().toLowerCase(); }
function cachedGeocodePoint(address){
  const exact=geocodeCache[geocodeKey(address)];
  if(validPoint(exact)) return exact;
  const canonicalKey=placeKey(address), canonical=geocodeCache[`place:${canonicalKey}`];
  if(validPoint(canonical)) return canonical;
  // Reuse legacy localStorage entries written before canonical place keys existed.
  for(const [key,point] of Object.entries(geocodeCache)){
    if(!key.startsWith("place:") && placeKey(key)===canonicalKey && validPoint(point)) return point;
  }
  return null;
}
function canonicalGeocodeAddress(address){
  return cleanGeocodeAddress(address).replace(/\b[A-Z]\d[A-Z]\s*\d[A-Z]\d\b/gi,"").replace(/\s+,/g,",").replace(/,\s*,/g,",").trim();
}
function placeKey(address){
  return cleanGeocodeAddress(address).toLowerCase()
    .replace(/\b[a-z]\d[a-z]\s*\d[a-z]\d\b/gi,"")
    .replace(/\b(?:ontario|on|canada)\b/g,"")
    .replace(/\bstreet\b|\bst\b/g,"st").replace(/\broad\b|\brd\b/g,"rd")
    .replace(/\bavenue\b|\bave\b/g,"ave").replace(/\bdrive\b|\bdr\b/g,"dr")
    .replace(/\bboulevard\b|\bblvd\b/g,"blvd").replace(/\bcourt\b|\bct\b/g,"ct")
    .replace(/\bcrescent\b|\bcres\b/g,"cres").replace(/[^a-z0-9]+/g," ").trim();
}
function validPoint(point){
  return Array.isArray(point) && point.length>=2 && Number.isFinite(Number(point[0])) && Number.isFinite(Number(point[1]))
    && Math.abs(Number(point[0]))<=90 && Math.abs(Number(point[1]))<=180;
}
function cleanGeocodeAddress(address){
  const text=String(address||"");
  const level="(?:unit|suite|floor|fl|rm|room|apartment|apt|\\d+(?:st|nd|rd|th)?\\s+floor)";
  const match=text.match(new RegExp(`(?:^|,\\s*)(\\d+\\s+[^,]+(?:,\\s*${level}\\b[^,]*)?,\\s*[^,]+,\\s*(?:ON|Ontario)\\b.*)$`,"i"));
  return (match?.[1]||text).replace(new RegExp(`,\\s*${level}\\b[^,]*`,"i"),"").trim();
}
function canGeocode(address){ return /^\d+\s+.+,\s*[^,]+,\s*(ON|Ontario)\b/i.test(cleanGeocodeAddress(address)); }
function queueGeocode(address){
  const addressKey=geocodeKey(address), key=`place:${placeKey(address)}`;
  if(validPoint(geocodeCache[addressKey]) || validPoint(geocodeCache[key]) || geocodePending.has(key)) return;
  geocodePending.add(key);
  geocodeQueue=geocodeQueue.then(async()=>{
    if(validPoint(geocodeCache[addressKey]) || validPoint(geocodeCache[key])) { geocodePending.delete(key); return; }
    delete geocodeCache[addressKey]; delete geocodeCache[key];
    const wait=Math.max(0,1100-(Date.now()-lastGeocodeAt));
    if(wait) await new Promise(resolve=>setTimeout(resolve,wait));
    lastGeocodeAt=Date.now();
    try{
      const streetAddress=canonicalGeocodeAddress(address);
      const url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ca&q="+encodeURIComponent(streetAddress);
      let found=[];
      for(let attempt=0;attempt<2;attempt++){
        const response=await fetch(url,{headers:{"Accept":"application/json"}});
        if(response.ok){ found=await response.json(); break; }
        if(attempt===0 && (response.status===429 || response.status>=500)){
          await new Promise(resolve=>setTimeout(resolve,2500));
          continue;
        }
        break;
      }
      if(found[0]){
        const point=[Number(found[0].lat),Number(found[0].lon)];
        if(!validPoint(point)) { geocodePending.delete(key); return; }
        geocodeCache[addressKey]=point; geocodeCache[key]=point;
        try{ localStorage.setItem(GEOCODE_CACHE_KEY,JSON.stringify(geocodeCache)); }catch(e){}
        if(lastData) drawMap(lastData.results||[]);
      }
    }catch(e){ /* map continues to work when the geocoder is unavailable */ }
    geocodePending.delete(key);
  });
}

function renderRegionOptions(){
  const select = $("#regionSelect");
  if(!select || !regions.length) return;
  const wanted = selectedRegion;
  select.innerHTML = regions.map(r=>`<option value="${esc(r.id)}">${esc(r.names?.[lang] || r.id)}</option>`).join("");
  if(regions.some(r=>r.id===wanted)) select.value=wanted;
}
$("#regionSelect").addEventListener("change", e=>{
  selectedRegion=e.target.value;
  if(map) drawMap(lastData?.results || []);
  if(lastData) search();
});
fetch("/api/meta").then(r=>r.json()).then(m=>{
  $("#sampleBanner").hidden = !m.has_sample_data;
  regions=m.regions || [];
  selectedRegion=m.default_region || "waterloo_region";
  renderRegionOptions();
}).catch(()=>{});
applyLang();
</script>
